<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<script>
  (() => {
    const saved = localStorage.getItem('gyue-theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
  })();
</script>
<link rel="icon" href="{{ '/assets/img/favicon.svg?v=2' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/site-shell.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
